name: my_menu_app
description: A new Flutter menu application lab.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Registering the images folder here
  assets:
    - assets/images/cappuccino.jpg
    - assets/images/espresso.jpg
    - assets/images/latte.jpg
    - assets/images/matcha.jpg
    - assets/images/mocha_latte.jpg
    - assets/images/strawberry_matcha.jpg
